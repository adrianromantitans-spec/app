project_id = "divzplit"

[functions.push-dispatch]
verify_jwt = false

[functions.native-push-dispatch]
verify_jwt = false

[auth.email.template.recovery]
subject = '''{{ if eq .Data.language "ro" }}DivZplit — Cod de recuperare{{ else if eq .Data.language "es" }}DivZplit — Código de recuperación{{ else }}DivZplit — Recovery code{{ end }}'''
content_path = "./supabase/templates/reset-password.html"

# Anonymous pre-login preflight; handler verifies Turnstile server-side.
# This does not enable the frontend check, CAPTCHA settings or an Auth Hook.
[functions.oauth-turnstile]
verify_jwt = false
